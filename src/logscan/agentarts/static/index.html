<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LogScan 智能体 · 安全日志漏洞扫描</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121a2e; --panel2:#182238; --line:#25324d;
    --txt:#e7ecf6; --dim:#8fa2c4; --accent:#38bdf8; --accent2:#a78bfa;
    --crit:#ff4d4f; --high:#ff9c3f; --med:#ffd666; --low:#7fd1ff; --info:#8fa2c4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 15% -10%,#16233d 0%,var(--bg) 60%),var(--bg);
    color:var(--txt);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden
  }
  header{
    display:flex;align-items:center;gap:14px;padding:12px 18px;
    background:rgba(18,26,46,.75);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
       box-shadow:0 0 12px var(--accent);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .brand small{font-weight:400;color:var(--dim);font-size:12px}
  .ctrl{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
  label.f{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:6px}
  select,input,textarea{
    background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font:inherit;outline:none
  }
  select:focus,input:focus,textarea:focus{border-color:var(--accent)}
  button{
    cursor:pointer;border:0;border-radius:9px;padding:9px 18px;font:inherit;font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08111f;
    transition:transform .12s,filter .12s
  }
  button:hover{filter:brightness(1.08)}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.5;cursor:not-allowed}
  main{flex:1;display:grid;grid-template-columns:390px 1fr;gap:12px;padding:12px;min-height:0}
  .pane{
    background:linear-gradient(180deg,rgba(24,34,56,.85),rgba(18,26,46,.85));
    border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0
  }
  .pane h2{
    margin:0;padding:12px 16px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px
  }
  .pane .body{padding:14px;overflow:auto;flex:1;min-height:0}
  #left .body{display:flex;flex-direction:column;gap:10px}
  textarea{width:100%;flex:1;min-height:180px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.5}
  /* 拖拽上传 */
  .dropzone{
    border:1.5px dashed var(--line);border-radius:10px;padding:13px 12px;text-align:center;
    color:var(--dim);font-size:12.5px;cursor:pointer;transition:.15s;
    display:flex;flex-direction:column;align-items:center;gap:3px
  }
  .dropzone:hover,.dropzone.on{border-color:var(--accent);background:rgba(56,189,248,.07);color:var(--txt)}
  .dropzone .dzico{font-size:17px;line-height:1.2}
  .dropzone small{font-size:11px;color:var(--dim)}
  .dropzone u{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
  .filechip{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent);
    background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);
    border-radius:8px;padding:6px 10px;word-break:break-all
  }
  .filechip .x{margin-left:auto;cursor:pointer;color:var(--dim);font-weight:700;flex:0 0 auto}
  .filechip .x:hover{color:var(--crit)}
  .right{display:grid;grid-template-rows:minmax(180px,40%) 1fr;gap:12px;min-height:0}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px;min-height:20px}
  .status .spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 实时步骤流 */
  .step{
    display:flex;gap:10px;padding:8px 10px;margin-bottom:7px;border-radius:10px;
    background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.16);
    animation:fade .35s ease both
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .step .ico{font-size:15px;line-height:1.5;flex:0 0 auto}
  .step .txt{min-width:0;word-break:break-word}
  .step .ttl{font-weight:600}
  .step .sub{color:var(--dim);font-size:12px;font-family:ui-monospace,Consolas,monospace;
             white-space:pre-wrap;word-break:break-all;max-height:76px;overflow:hidden}
  .step.tool_result{background:rgba(167,139,250,.05);border-color:rgba(167,139,250,.16)}
  .step.final{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3)}
  .step.error{background:rgba(255,77,79,.1);border-color:rgba(255,77,79,.35)}
  .step.llm_response{background:rgba(255,255,255,.03);border-color:var(--line)}

  /* 报告 */
  .summary{font-size:15px;line-height:1.7;padding:12px 14px;border-radius:12px;
    background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(167,139,250,.1));
    border:1px solid rgba(56,189,248,.25);margin-bottom:12px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .stat b{display:block;font-size:20px;line-height:1.3}
  .stat span{color:var(--dim);font-size:11.5px}
  .vuln{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--dim);
        border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .vuln.CRITICAL{border-left-color:var(--crit)} .vuln.HIGH{border-left-color:var(--high)}
  .vuln.MEDIUM{border-left-color:var(--med)} .vuln.LOW{border-left-color:var(--low)}
  .vuln .hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
  .vuln .hd .t{font-weight:700;font-size:15px}
  .vuln .kv{color:var(--dim);font-size:12.5px;margin:3px 0}
  .vuln .kv em{color:var(--txt);font-style:normal}
  .bar{height:6px;border-radius:4px;background:#0d1526;overflow:hidden;margin:8px 0 2px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .ev{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#b9c7de;
      background:#0d1526;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:5px 0;
      white-space:pre-wrap;word-break:break-all}
  .sec{margin:16px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
       border-bottom:1px dashed var(--line);padding-bottom:5px}
  .chain{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:9px}
  .chain .ip{font-weight:700;color:var(--accent)}
  .chain ol{margin:7px 0 6px;padding-left:22px;color:#c3d0e6;font-size:12.5px}
  .chain li{margin:2px 0}
  .empty{color:var(--dim);text-align:center;padding:26px 10px;font-size:13px}
  footer{padding:7px 18px;color:var(--dim);font-size:11.5px;border-top:1px solid var(--line);
         display:flex;gap:16px;flex-wrap:wrap}
  code{background:#0d1526;padding:1px 6px;border-radius:5px;color:#a9c4e6}
  .anscard{background:linear-gradient(180deg,#131c30,#101828);border:1px solid var(--line);
           border-radius:12px;overflow:hidden}
  .anshead{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);
           background:#0f1728;font-size:12px;color:var(--dim)}
  .anshead .tag{font-weight:700;color:var(--accent);letter-spacing:.5px}
  .anshead .copy{margin-left:auto;cursor:pointer;color:var(--dim);border:1px solid var(--line);
           background:#0d1526;border-radius:6px;padding:2px 10px;font-size:11.5px;font-family:inherit}
  .anshead .copy:hover{color:var(--txt);border-color:var(--accent)}
  .ansbody{padding:14px 16px;line-height:1.78;font-size:13.5px;color:var(--txt)}
  .ansbody p{margin:0 0 9px}
  .ansbody ul,.ansbody ol{margin:7px 0 11px;padding-left:23px;color:#c3d0e6}
  .ansbody li{margin:3px 0}
  .ansbody strong{color:var(--accent)}
  .ansbody code{background:#0d1526;padding:1px 6px;border-radius:5px;color:#a9c4e6;font-size:12.5px}
  .ansbody h4{margin:11px 0 6px;font-size:13.5px;color:#dbe6f7;
           border-left:3px solid var(--accent);padding-left:9px}
  .ansbody .num{display:inline-block;min-width:20px;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>LogScan 智能体
    <small>· 安全日志漏洞扫描 · ReAct 工具调用</small></div>
  <div class="ctrl">
    <label class="f">任务
      <select id="task">
        <option value="analyze">完整分析报告</option>
        <option value="chat">自然语言问答</option>
      </select>
    </label>
    <label class="f">模式
      <select id="mode"><option value="llm">llm（真模型）</option><option value="mock">mock（规则兜底）</option></select>
    </label>
    <label class="f">模型 <select id="model"></select></label>
    <label class="f">最大步数 <input id="steps" type="number" value="12" min="1" max="50" style="width:72px"></label>
    <button id="go">开始分析</button>
    <button id="clear" style="background:#1a2334;color:var(--dim)">清空</button>
  </div>
</header>

<main>
  <section class="pane" id="left">
    <h2>① 日志输入</h2>
    <div class="body">
      <label class="f">载入示例
        <select id="sample" style="flex:1"><option value="">— 选择一个示例日志 —</option></select>
      </label>
      <div class="dropzone" id="dropzone">
        <span class="dzico">⬆</span>
        <span>把日志文件拖到这里，或 <u>点击选择文件</u></span>
        <small>支持 .log / .csv / .txt，也可直接拖到下方输入框</small>
      </div>
      <input type="file" id="file" accept=".log,.csv,.txt,.json,.out,.log.*,text/*" hidden />
      <div class="filechip" id="filechip" style="display:none"></div>
      <textarea id="log" placeholder="把日志内容粘贴到这里，或拖入 / 选择文件，也可以从上面选一个示例…"></textarea>
      <label class="f" id="qwrap" style="display:none">问题
        <input id="q" type="text" style="flex:1"
               placeholder="用自然语言提问，如：哪些 IP 在做暴力破解？最可疑的路径有哪些？">
      </label>
      <div class="status" id="status">待机中 · 选择任务后点击按钮开始</div>
    </div>
  </section>

  <section class="right">
    <div class="pane">
      <h2>② Agent 实时分析过程 <span class="chip" id="stepcount" style="background:rgba(56,189,248,.15);color:var(--accent)">0 步</span></h2>
      <div class="body" id="trace">
        <div class="empty">等待开始…<br>开始后这里会实时显示 Agent 调用了哪些工具、拿到什么结果。</div>
      </div>
    </div>
    <div class="pane">
      <h2 id="outtitle">③ 分析报告</h2>
      <div class="body" id="report">
        <div class="empty">分析完成后在这里展示结构化漏洞报告。</div>
      </div>
    </div>
  </section>
</main>

<footer>
  <span>本地演示服务：<code id="addr"></code></span>
  <span>局域网内其他电脑/投影可直接用浏览器打开上面地址</span>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEV = {CRITICAL:'var(--crit)',HIGH:'var(--high)',MEDIUM:'var(--med)',LOW:'var(--low)',INFO:'var(--info)'};
let jobId = null, timer = null, lastLen = 0;

document.getElementById('addr').textContent = location.origin;

// 初始化：模型列表 + 示例日志
(async () => {
  try {
    const ms = await (await fetch('/demo/models')).json();
    $('#model').innerHTML = ms.map(m => `<option value="${esc(m.name)}">${esc(m.label)}</option>`).join('');
  } catch (e) { $('#model').innerHTML = '<option>加载失败</option>'; }
  try {
    const ss = await (await fetch('/demo/samples')).json();
    window.__samples = ss;
    $('#sample').innerHTML = '<option value="">— 选择一个示例日志 —</option>' +
      ss.map((s,i) => `<option value="${i}">${esc(s.name)}</option>`).join('');
  } catch (e) {}
})();

$('#sample').onchange = (e) => {
  const s = (window.__samples || [])[e.target.value];
  if (s) {
    $('#log').value = s.content;
    window.__sampleName = s.name;
    showFileChip(`${s.name} · 示例日志`);
  }
};

// ---------------- 拖拽 / 选择文件上传 ----------------
const MAX_MB = 8;

function showFileChip(text) {
  const chip = $('#filechip');
  chip.style.display = 'flex';
  chip.innerHTML = `<span>📄 ${esc(text)}</span><span class="x" title="移除">×</span>`;
  chip.querySelector('.x').onclick = () => {
    $('#log').value = '';
    window.__sampleName = null;
    chip.style.display = 'none';
    setStatus('', '已移除文件 · 可重新拖入或选择示例');
  };
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_MB * 1024 * 1024) {
    setStatus('error', `文件过大（${(file.size / 1048576).toFixed(1)}MB），请控制在 ${MAX_MB}MB 以内`);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result || '');
    $('#log').value = text;
    window.__sampleName = file.name;   // 供后端按后缀识别 .csv
    const lines = text.split(/\r?\n/).filter(x => x.trim()).length;
    showFileChip(`${file.name} · ${(file.size / 1024).toFixed(1)} KB · ${lines} 行`);
    setStatus('ok', `已载入 ${file.name} · 点击「开始分析」即可`);
  };
  reader.onerror = () => setStatus('error', '文件读取失败，请换一个文件或直接粘贴内容');
  reader.readAsText(file, 'utf-8');
}

// 拖到虚线框或输入框都能接收
[$('#dropzone'), $('#log')].forEach(el => {
  el.addEventListener('dragover', (e) => {
    e.preventDefault();
    $('#dropzone').classList.add('on');
  });
  el.addEventListener('dragleave', () => $('#dropzone').classList.remove('on'));
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    $('#dropzone').classList.remove('on');
    loadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });
});

$('#dropzone').onclick = () => $('#file').click();
$('#file').onchange = (e) => {
  loadFile(e.target.files && e.target.files[0]);
  e.target.value = '';   // 允许重复选同一个文件
};

// 防止拖到页面其他位置时浏览器直接打开文件
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());

$('#mode').onchange = () => { $('#model').disabled = ($('#mode').value === 'mock'); };

$('#clear').onclick = () => {
  if (timer) { clearInterval(timer); timer = null; }
  $('#go').disabled = false;
  $('#log').value = '';
  $('#q').value = '';
  $('#sample').value = '';
  $('#filechip').style.display = 'none';
  window.__sampleName = null;
  $('#trace').innerHTML = '<div class="empty">等待开始…<br>开始后这里会实时显示 Agent 调用了哪些工具、拿到什么结果。</div>';
  $('#report').innerHTML = '<div class="empty">分析完成后在这里展示结构化漏洞报告。</div>';
  $('#outtitle').textContent = '③ 分析报告';
  $('#stepcount').textContent = '0 步';
  $('#status').className = 'status';
  $('#status').textContent = '已清空 · 选择任务后点击按钮开始';
};

// 任务切换：完整分析报告 / 自然语言问答
$('#task').onchange = () => {
  const chat = $('#task').value === 'chat';
  $('#qwrap').style.display = chat ? 'flex' : 'none';
  $('#go').textContent = chat ? '开始提问' : '开始分析';
  $('#outtitle').textContent = chat ? '③ 问答回答' : '③ 分析报告';
  $('#report').innerHTML = chat
    ? '<div class="empty">提问后这里显示自然语言回答。</div>'
    : '<div class="empty">分析完成后在这里展示结构化漏洞报告。</div>';
};

// 问题框按 Enter 直接开始提问
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!$('#go').disabled) $('#go').click();
  }
});

$('#go').onclick = async () => {
  const content = $('#log').value.trim();
  if (!content) { $('#status').textContent = '请先粘贴日志内容或选择一个示例'; return; }
  const task = $('#task').value, question = $('#q').value.trim();
  if (task === 'chat' && !question) { $('#status').textContent = '请输入要提问的问题'; return; }
  if (timer) { clearInterval(timer); timer = null; }

  const mode = $('#mode').value, model = $('#model').value;
  const payload = {
    mode,
    sources: [{ content, filename: window.__sampleName || 'access.log' }],
    options: { max_steps: parseInt($('#steps').value) || 12, model }
  };
  if (task === 'chat') payload.question = question;

  $('#go').disabled = true;
  $('#trace').innerHTML = '<div class="empty">Agent 启动中…</div>';
  $('#report').innerHTML = task === 'chat'
    ? '<div class="empty">正在查询日志、组织回答…</div>'
    : '<div class="empty">分析进行中，完成后显示报告…</div>';
  $('#stepcount').textContent = '0 步';
  lastLen = 0;
  setStatus('running', task === 'chat'
    ? 'Agent 查询日志中…（真模型单次约 20–90 秒）'
    : 'Agent 运行中…（真模型单次约 20–90 秒，请稍候）');

  const url = (task === 'chat' ? '/demo/chat/start' : '/demo/start') +
              '?model=' + encodeURIComponent(model);
  try {
    const r = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error('启动失败 HTTP ' + r.status);
    jobId = (await r.json()).job_id;
    timer = setInterval(poll, 600);
  } catch (e) {
    $('#go').disabled = false;
    setStatus('error', '启动失败：' + e.message);
  }
};

async function poll() {
  let j;
  try { j = await (await fetch('/demo/status/' + jobId)).json(); }
  catch (e) { return; }              // 网络抖动，下一轮再试
  renderTrace(j.steps || []);
  if (j.status === 'done') {
    clearInterval(timer); timer = null; $('#go').disabled = false;
    const r = j.result || {};
    setStatus(r.success ? 'ok' : 'error',
      (r.success ? '完成 · 共 ' : '失败 · ') + Math.round((r.total_elapsed_ms||0)/1000) + ' 秒');
    if (j.kind === 'chat') renderAnswer(r); else renderReport(r);
    if (!(j.steps || []).length) {
      // mock 问答不产生工具步骤，给个说明避免一直停在"启动中…"
      $('#trace').innerHTML = '<div class="empty">本次任务未产生工具调用步骤' +
        (j.kind === 'chat' ? '（mock 模式为规则直答，不经过 Agent 工具循环）' : '') + '。</div>';
    }
  } else if (j.status === 'error') {
    clearInterval(timer); timer = null; $('#go').disabled = false;
    setStatus('error', '任务异常：' + (j.error || '未知错误'));
  }
}

function setStatus(kind, text) {
  const s = $('#status');
  s.innerHTML = (kind === 'running' ? '<span class="spin"></span>' : '') + esc(text);
  s.style.color = kind === 'error' ? 'var(--crit)' : kind === 'ok' ? '#4ade80' : 'var(--dim)';
}

// ---------------- 实时步骤 ----------------
const META = {
  tool_call:    { ico: '🔧', ttl: '调用工具' },
  tool_result:  { ico: '↳',  ttl: '工具返回' },
  llm_response: { ico: '🧠', ttl: '模型输出' },
  final:        { ico: '✅', ttl: '生成最终报告' },
  error:        { ico: '⚠️', ttl: '错误' }
};

function renderTrace(steps) {
  const box = $('#trace');
  if (!steps.length) return;
  if (steps.length !== lastLen) {
    // 只追加新步骤，避免整块重绘导致闪烁
    const frag = document.createDocumentFragment();
    for (const s of steps.slice(lastLen)) frag.appendChild(stepEl(s));
    if (lastLen === 0) box.innerHTML = '';
    box.appendChild(frag);
    box.scrollTop = box.scrollHeight;
    lastLen = steps.length;
    $('#stepcount').textContent = steps.length + ' 步';
  }
}

function stepEl(s) {
  const m = META[s.type] || { ico: '•', ttl: s.type };
  const el = document.createElement('div');
  el.className = 'step ' + s.type;
  let ttl = m.ttl, sub = '';
  if (s.tool_name) ttl += ' · ' + s.tool_name;
  if (s.type === 'tool_call' && s.tool_args && Object.keys(s.tool_args).length)
    sub = JSON.stringify(s.tool_args);
  else if (s.type === 'tool_result' && s.tool_result) sub = s.tool_result;
  else if (s.content) sub = s.content;
  if (s.elapsed_ms) ttl += `  (${(s.elapsed_ms/1000).toFixed(1)}s)`;
  el.innerHTML = `<span class="ico">${m.ico}</span><span class="txt">
      <div class="ttl">${esc(ttl)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</span>`;
  return el;
}

// ---------------- 报告 ----------------
// 轻量 Markdown 渲染：支持 **加粗**、`代码`、- 无序列表、1. 有序列表、# 小标题
function inlineFmt(s) {
  return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function formatAnswer(text) {
  const lines = esc(text).split(/\r?\n/);
  const out = [];
  let mode = null;                                  // 当前打开的列表类型
  const close = () => { if (mode) { out.push(`</${mode}>`); mode = null; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { close(); continue; }
    let m;
    if ((m = line.match(/^[-*•]\s+(.*)$/))) {
      if (mode !== 'ul') { close(); out.push('<ul>'); mode = 'ul'; }
      out.push(`<li>${inlineFmt(m[1])}</li>`); continue;
    }
    if ((m = line.match(/^(\d+)[.、)]\s+(.*)$/))) {
      if (mode !== 'ol') { close(); out.push('<ol>'); mode = 'ol'; }
      out.push(`<li>${inlineFmt(m[2])}</li>`); continue;
    }
    if ((m = line.match(/^#{1,4}\s*(.+)$/))) {
      close(); out.push(`<h4>${inlineFmt(m[1])}</h4>`); continue;
    }
    close();
    out.push(`<p>${inlineFmt(line)}</p>`);
  }
  close();
  return out.join('');
}

function renderAnswer(r) {
  const box = $('#report');
  if (!r || !r.success) {
    box.innerHTML = `<div class="empty">未得到回答${r && r.error ? '：' + esc(r.error) : ''}</div>`;
    return;
  }
  const text = r.answer || '（空回答）';
  const secs = ((r.total_elapsed_ms || 0) / 1000).toFixed(1);
  box.innerHTML = `
    <div class="anscard">
      <div class="anshead"><span class="tag">回答</span><span>耗时 ${secs}s</span>
        <button class="copy" id="copyans">复制</button></div>
      <div class="ansbody">${formatAnswer(text)}</div>
    </div>`;
  const btn = $('#copyans');
  if (btn) btn.onclick = () => copyText(text, btn);
}

// 复制：优先用 Clipboard API，非安全上下文（http + 非 localhost）退回到 execCommand
function copyText(text, btn) {
  const done = (ok) => {
    btn.textContent = ok ? '已复制' : '复制失败';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => done(true)).catch(() => done(fallbackCopy(text)));
  } else {
    done(fallbackCopy(text));
  }
}

function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function sevBadge(sev) {
  const c = SEV[sev] || 'var(--info)';
  return `<span class="chip" style="background:${c}22;color:${c};border:1px solid ${c}55">${esc(sev || '-')}</span>`;
}
function reviewBadge(st) {
  const map = { CONFIRMED: '#4ade80', NEEDS_REVIEW: 'var(--med)', FALSE_POSITIVE: 'var(--dim)', AUTO_RESOLVED: 'var(--low)' };
  const c = map[st] || 'var(--dim)';
  return `<span class="chip" style="background:${c}22;color:${c}">${esc(st || '-')}</span>`;
}

function renderReport(r) {
  const box = $('#report');
  if (!r || r.error) {
    box.innerHTML = `<div class="empty">未生成报告${r && r.error ? '：' + esc(r.error) : ''}</div>`;
    return;
  }
  const rep = r.report || {};
  const ov = rep.log_overview || {};
  const st = rep.statistics || {};
  const by = st.by_severity || {};
  let h = '';

  if (rep.summary) h += `<div class="summary">${esc(rep.summary)}</div>`;

  h += '<div class="grid3">';
  h += `<div class="stat"><b>${esc(ov.total_entries ?? '—')}</b><span>日志条目</span></div>`;
  h += `<div class="stat"><b>${esc(st.total_findings ?? (rep.vulnerabilities||[]).length)}</b><span>发现问题</span></div>`;
  h += `<div class="stat"><b style="color:var(--crit)">${esc(by.CRITICAL ?? 0)}</b><span>CRITICAL</span></div>`;
  h += `<div class="stat"><b style="color:var(--high)">${esc(by.HIGH ?? 0)}</b><span>HIGH</span></div>`;
  h += `<div class="stat"><b style="color:var(--med)">${esc(by.MEDIUM ?? 0)}</b><span>MEDIUM</span></div>`;
  if (r.total_elapsed_ms) h += `<div class="stat"><b>${(r.total_elapsed_ms/1000).toFixed(1)}s</b><span>总耗时</span></div>`;
  h += '</div>';

  if (ov.time_range) h += `<div class="kv" style="color:var(--dim);font-size:12.5px">时间范围：<em style="color:var(--txt)">${esc(ov.time_range)}</em></div>`;
  if (Array.isArray(ov.key_observations) && ov.key_observations.length) {
    h += '<div class="sec">日志概览</div>';
    h += ov.key_observations.map(o => `<div class="ev">${esc(o)}</div>`).join('');
  }

  const vulns = rep.vulnerabilities || [];
  if (vulns.length) {
    h += '<div class="sec">漏洞明细</div>';
    for (const v of vulns) {
      const conf = typeof v.confidence === 'number' ? v.confidence : null;
      const ms = v.model_score || null;
      h += `<div class="vuln ${esc(v.severity)}">
        <div class="hd">
          <span class="t">${esc(v.id || '')} ${esc(v.type || '')}</span>
          ${sevBadge(v.severity)} ${reviewBadge(v.review_status)}
        </div>
        ${v.description ? `<div class="kv">${esc(v.description)}</div>` : ''}
        ${conf !== null ? `<div class="kv">置信度 <em>${(conf*100).toFixed(1)}%</em></div>
            <div class="bar"><i style="width:${Math.max(3, Math.min(100, conf*100))}%"></i></div>` : ''}
        ${v.source_ips && v.source_ips.length ? `<div class="kv">来源 IP：<em>${esc(v.source_ips.join(', '))}</em></div>` : ''}
        ${v.affected_paths && v.affected_paths.length ? `<div class="kv">涉及路径：<em>${esc(v.affected_paths.slice(0,6).join(' , '))}</em></div>` : ''}
        ${v.detection_method ? `<div class="kv">检测方式：<em>${esc(v.detection_method)}</em>${ms ? ` · 模型打分 <em>${esc(ms.category)} ${esc(ms.score)}</em>` : ''}</div>` : ''}
        ${v.recommendation ? `<div class="kv">修复建议：<em>${esc(v.recommendation)}</em></div>` : ''}
        ${Array.isArray(v.evidence) && v.evidence.length ? `<div class="sec" style="margin:9px 0 5px">证据</div>` +
            v.evidence.map(e => `<div class="ev">${esc(e)}</div>`).join('') : ''}
        ${v.judgment ? `<div class="kv" style="margin-top:6px">研判：<em>${esc(v.judgment)}</em></div>` : ''}
      </div>`;
    }
  }

  const chains = rep.attack_chains || [];
  if (chains.length) {
    h += '<div class="sec">攻击链复盘</div>';
    for (const c of chains) {
      h += `<div class="chain"><span class="ip">${esc(c.attacker_ip || '')}</span>
        <ol>${(c.steps || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol>
        ${c.assessment ? `<div class="kv">${esc(c.assessment)}</div>` : ''}</div>`;
    }
  }

  const rs = r.review_summary || {};
  if (Object.keys(rs).length) {
    h += '<div class="sec">人工复核节点</div><div class="grid3">' +
      Object.entries(rs).map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('') + '</div>';
  }

  if (rep.raw) h += `<div class="sec">原始输出</div><div class="ev">${esc(String(rep.raw).slice(0, 4000))}</div>`;

  box.innerHTML = h || '<div class="empty">报告为空</div>';
}
</script>
