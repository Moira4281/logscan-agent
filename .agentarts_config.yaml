default_agent: logscan-agent-runtime
agents:
  logscan-agent-runtime:
    base:
      name: logscan-agent-runtime
      entrypoint: app:app
      dependency_file: requirements.txt
      region: cn-southwest-2
      platform: linux/amd64
      language: python3
      base_image: python:3.10-slim
      container_runtime: docker
      arch: x86_64
    swr_config:
      organization_auto_create: true
      organization: agentarts-cnso2-9oxgcovl-org
      repository_auto_create: true
      repository: logscan-agent-runtime
    runtime:
      arch: arm64
      agent_gateway_id: null
      agent_id: 90de6d9b-62d8-493d-9dce-48cf19c707ab
      execution_agency_name: null
      invoke_config:
        protocol: HTTP
        port: 8080
        file_transfer_config: null
        url_match_type: ACCURATE_MATCH
      network_config:
        network_mode: PUBLIC
        vpc_config:
          vpc_id: null
          subnet_id: null
          security_group_id: []
      identity_configuration:
        authorizer_type: IAM
        authorizer_configuration: null
      observability:
        tracing:
          enabled: false
        metrics:
          enabled: false
        logs:
          enabled: false
      artifact_source:
        url: null
        swr_instance_id: null
        commands: []
      storage_config:
        sfs_turbo:
          sfs_turbo_id: null
          sfs_path: null
          mount_path: null
          read_only: null
        session_storage:
          mount_path: null
      environment_variables: []
      tags: []
